# Test overrides, loaded on top of src/main/resources/application.properties
# (classpath:/config/ wins over classpath:/). Lets @SpringBootTest run on an
# in-memory H2 database without Postgres or real mail credentials.
# One database per Spring context, so cached contexts never share tables.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.username=test@example.invalid
spring.mail.password=test
app.admin.email=admin@example.invalid
# Spring Session's JDBC tables, created once per context.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/session/jdbc/schema-h2.sql
