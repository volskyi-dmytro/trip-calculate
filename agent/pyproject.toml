[project]
name = "tripcalculate-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "langfuse>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    # evals/ reads YAML fixtures. Available transitively today; declared here
    # so the evaluation suite does not depend on another package's dependency.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
# Only the service ships. Without this, flat-layout auto-discovery sees both
# `app` and `evals` and refuses to build at all. `evals` is developer tooling —
# the Dockerfile copies `app/` alone — and stays importable from the repo root
# for pytest and `python -m evals.runner`.
#
# This must be the `find` directive, not an explicit `packages = ["app"]`:
# the Dockerfile installs from pyproject.toml *before* copying `app/`, and an
# explicit list fails with "package directory 'app' does not exist" at that
# layer. `find` simply matches nothing there, which is what that layer wants.
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires OPENAI_API_KEY",
    "db: requires DATABASE_URL pointing at a Postgres with V5 applied",
]
