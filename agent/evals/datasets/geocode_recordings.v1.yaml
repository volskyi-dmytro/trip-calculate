  # Native-script-only on purpose: OSM knows this village by its Ukrainian
  # spelling, so the transliteration "Solovychi ..." must miss and the
  # original_name fallback must be what rescues it.
  - id: solovychi
    match_any: ["соловичі"]
    name: Соловичі
