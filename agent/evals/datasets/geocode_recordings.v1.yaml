version: v1
kind: geocode_recordings
description: >
  Hand-authored, Nominatim-shaped geocoding responses that make route
  evaluation reproducible. These are NOT verbatim captures of live Nominatim
  traffic: coordinates are approximate and exist so routes are plausible, not
  to assert geographic precision. A query matching no entry here fails to
  geocode, which is exactly what a real miss looks like to the agent.

  Matching is by lowercase substring, longest matched needle wins.

places:
  # ── Ukraine ──────────────────────────────────────────────────────────────
  - id: kyiv
    match_any: ["kyiv", "kiev", "київ", "києв"]
    name: Kyiv
    display_name: "Kyiv, Ukraine"
    lat: 50.4501
    lon: 30.5234
    country_code: ua
    country: Ukraine

  - id: lviv-oblast
    match_any: ["lviv oblast", "lvivska", "львівськ", "львівщин"]
    name: Lviv Oblast
    display_name: "Lviv Oblast, Ukraine"
    type: administrative
    class: boundary
    lat: 49.65
    lon: 23.90
    country_code: ua
    country: Ukraine

  - id: lviv
    match_any: ["lviv", "lvov", "львів", "львов"]
    name: Lviv
