    mock:
      estimate:
        unknown: false
        makeModel: "Mitsubishi Lancer X 1.6"
        fuelType: petrol
        consumptionL100km: 7.8

  - id: incomplete-logan-cyrillic
    tags: [petrol, cyrillic, incomplete]
    input:
      description: "рено логан"
      language: uk
    expect:
      unknown: false
      fuel_type: petrol
      consumption_range: [5.5, 8.5]
      make_model_contains_any: ["logan", "логан"]
    mock:
