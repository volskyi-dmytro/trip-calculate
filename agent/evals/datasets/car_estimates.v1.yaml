  - id: incomplete-yaris-cyrillic
    tags: [petrol, cyrillic, incomplete]
    input:
      description: "тойота ярис"
      language: uk
    expect:
      unknown: false
      fuel_type: petrol
      consumption_range: [5.0, 7.5]
      make_model_contains_any: ["yaris", "ярис"]
    mock:
      estimate:
        unknown: false
        makeModel: "Toyota Yaris 1.3"
        fuelType: petrol
        consumptionL100km: 6.3

  - id: incomplete-transporter-t4-diesel-cyrillic
    tags: [diesel, cyrillic, incomplete]
    input:
      description: "фольксваген транспортер т4"
      language: uk
    expect:
      unknown: false
      fuel_type: diesel
      consumption_range: [8.0, 11.0]
      make_model_contains_any: ["transporter", "транспортер"]
    mock:
      estimate:
        unknown: false
        makeModel: "Volkswagen Transporter T4 2.5 TDI"
        fuelType: diesel
        consumptionL100km: 9.6

  # ── Non-vehicle inputs (must yield unknown=true) ──

  - id: non-vehicle-fridge-cyrillic
    tags: [unknown, cyrillic, non-vehicle]
    input:
      description: "холодильник Samsung RB37"
      language: uk
    expect:
      unknown: true
    mock:
      estimate:
        unknown: true

  - id: non-vehicle-nonsense-latin
    tags: [unknown, latin, non-vehicle]
    input:
      description: "asdkjalksjd 12345 xyzzy"
      language: en
    expect:
      unknown: true
    mock:
      estimate:
        unknown: true

  # ── Genuinely ambiguous vehicle descriptions (must yield unknown=true) ──

  - id: ambiguous-bare-make-latin
    tags: [unknown, latin, ambiguous]
    input:
      description: "Toyota"
      language: en
    expect:
      unknown: true
