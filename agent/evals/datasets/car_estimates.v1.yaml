    expect:
      unknown: false
      fuel_type: petrol
      consumption_range: [6.0, 8.5]
      make_model_contains_any: ["corolla"]
    mock:
      estimate:
        unknown: false
        makeModel: "Toyota Corolla"
        fuelType: petrol
