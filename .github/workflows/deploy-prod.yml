name: Deploy to Production (VPS)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Run the real model against the curated, versioned fixtures before any
  # production image is built or pushed. Langfuse export is best-effort, but
  # deterministic evaluation failures block this release.
  evaluate:
    name: Live route-intelligence release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install agent evaluation dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live evaluation
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.PROD_LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.PROD_LANGFUSE_HOST }}
          LANGFUSE_TRACING_ENVIRONMENT: evaluation
          LANGFUSE_RELEASE: ${{ github.sha }}
        run: python -m evals.runner --mode live --fail-under 1.0

      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-report-${{ github.sha }}
          path: agent/evals/results/
          if-no-files-found: warn

  build:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for React frontend build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build React frontend with environment variables
      - name: Build React Frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VITE_API_URL: ""
        run: |
          cd frontend
          npm ci
          # Scoped to production deps with a documented waiver list — see
          # frontend/scripts/audit-ci.mjs for why bare `npm audit` cannot gate.
          npm run audit:ci
          npm run build

      # Copy React build to Spring Boot static resources
      - name: Copy Frontend to Spring Boot
        run: |
          echo "📦 Cleaning static directory..."
          rm -rf src/main/resources/static/*
          mkdir -p src/main/resources/static
          cp -r frontend/dist/* src/main/resources/static/

          echo "✅ Verifying build artifacts..."
          ls -la src/main/resources/static/index.html || { echo "❌ index.html missing!"; exit 1; }
          
          BUNDLE=$(grep -o "index-[^.]*\.js" src/main/resources/static/index.html | head -1)
          echo "📦 Bundle: $BUNDLE"
          ls -la "src/main/resources/static/assets/$BUNDLE" || { echo "❌ Bundle missing!"; exit 1; }

      # Setup Java and build Spring Boot
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build Spring Boot JAR
      - name: Build Spring Boot JAR
        run: |
          echo "🔨 Building Production JAR..."
          mvn clean package -DskipTests

          echo "✅ Verifying static assets in JAR..."
          jar tf target/*.jar | grep "BOOT-INF/classes/static/index.html" || { echo "❌ index.html not in JAR!"; exit 1; }

          echo "✅ Verifying application.properties in JAR..."
          jar tf target/*.jar | grep "BOOT-INF/classes/application.properties" || { echo "❌ application.properties not in JAR!"; exit 1; }

          echo "✅ Verifying application-prod.properties in JAR..."
          jar tf target/*.jar | grep "BOOT-INF/classes/application-prod.properties" || { echo "❌ application-prod.properties not in JAR!"; exit 1; }

          echo "✅ Verifying application-prod.properties has content..."
          PROD_PROPS=$(jar xf target/*.jar BOOT-INF/classes/application-prod.properties && cat BOOT-INF/classes/application-prod.properties && rm -rf BOOT-INF)
          if [ $(echo "$PROD_PROPS" | wc -l) -lt 10 ]; then
            echo "❌ application-prod.properties appears to be empty or corrupted!"
            echo "Content: $PROD_PROPS"
            exit 1
          fi
          echo "   File has $(echo "$PROD_PROPS" | wc -l) lines ✓"

          echo "✅ All required files verified in JAR"

      # Build and push Docker image with production tag
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          echo "📦 Listing JARs in target directory..."
          ls -lh target/*.jar

          echo "🔨 Building Docker image..."
          docker build -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate:prod-${{ github.sha }} .

          echo "🔍 Verifying properties files in built Docker image BEFORE pushing..."
          CONTAINER_ID=$(docker create ${{ secrets.DOCKER_USERNAME }}/trip-calculate:latest)
          docker cp $CONTAINER_ID:/app/trip-calculate.jar /tmp/verify-docker.jar
          docker rm $CONTAINER_ID

          jar tf /tmp/verify-docker.jar | grep "BOOT-INF/classes/application.properties" || { echo "❌ application.properties missing from Docker image!"; exit 1; }
          jar tf /tmp/verify-docker.jar | grep "BOOT-INF/classes/application-prod.properties" || { echo "❌ application-prod.properties missing from Docker image!"; exit 1; }
          echo "✅ Properties files verified in Docker image"
          rm /tmp/verify-docker.jar

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate:prod-${{ github.sha }} \
            --push .

      - name: Build and Push Agent Image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate-agent:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/trip-calculate-agent:prod-${{ github.sha }} \
            --push ./agent

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Deploy to VPS
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.PROD_DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.PROD_OAUTH_REDIRECT_URI }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.PROD_LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.PROD_LANGFUSE_HOST }}
          AGENT_URL: "http://trip-calculate-agent:8001"
        run: |
          ssh -i ~/.ssh/vps_deploy_key $VPS_USER@$VPS_HOST "DOCKER_USERNAME='${DOCKER_USERNAME}' GITHUB_SHA='${GITHUB_SHA}' DATABASE_URL='${DATABASE_URL}' DATABASE_USERNAME='${DATABASE_USERNAME}' DATABASE_PASSWORD='${DATABASE_PASSWORD}' GOOGLE_CLIENT_ID='${GOOGLE_CLIENT_ID}' GOOGLE_CLIENT_SECRET='${GOOGLE_CLIENT_SECRET}' OAUTH_REDIRECT_URI='${OAUTH_REDIRECT_URI}' GMAIL_USERNAME='${GMAIL_USERNAME}' GMAIL_APP_PASSWORD='${GMAIL_APP_PASSWORD}' ADMIN_EMAIL='${ADMIN_EMAIL}' MAPBOX_ACCESS_TOKEN='${MAPBOX_ACCESS_TOKEN}' REDIS_PASSWORD='${REDIS_PASSWORD}' OPENAI_API_KEY='${OPENAI_API_KEY}' LANGFUSE_PUBLIC_KEY='${LANGFUSE_PUBLIC_KEY}' LANGFUSE_SECRET_KEY='${LANGFUSE_SECRET_KEY}' LANGFUSE_HOST='${LANGFUSE_HOST}' AGENT_URL='${AGENT_URL}' bash -s" <<'REMOTE'
            set -Eeuo pipefail
            echo "🚀 Deploying to Production VPS..."

            # Create private Docker network if it doesn't exist
            docker network inspect trip-calculate-network >/dev/null 2>&1 || docker network create trip-calculate-network

            # Connect database to the deployment network idempotently.
            if [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "trip-calculate-network"}}connected{{end}}' trip-calculate-db)" = "connected" ]; then
              echo "✅ Database already on deployment network"
            else
              docker network connect trip-calculate-network trip-calculate-db
              echo "✅ Database connected to deployment network"
            fi

            # ==================== SECURITY CHECKS ====================
            echo "🔒 Running security verification..."
            
            # Check database port exposure
            if docker port trip-calculate-db 2>/dev/null | grep -q "5432"; then
              echo "⚠️ WARNING: Database port 5432 is EXPOSED to internet!"
              echo "❌ Failing deployment for security reasons"
              exit 1
            else
              echo "✅ Database security verified - port 5432 NOT exposed"
            fi

            # ==================== REDIS SETUP ====================
            echo ""
            echo "🔴 Setting up Redis cache..."
            
            # Check if Redis container exists
            if docker ps -a --format '{{.Names}}' | grep -q "^trip-calculate-redis$"; then
              echo "✅ Redis container exists"
              
              # Check if running
              if ! docker ps --format '{{.Names}}' | grep -q "^trip-calculate-redis$"; then
                echo "⚠️ Redis container stopped, starting..."
                docker start trip-calculate-redis
              else
                echo "✅ Redis already running"
              fi
            else
              echo "📦 Creating new Redis container..."
              docker run -d \
                --name trip-calculate-redis \
                --network trip-calculate-network \
                --restart unless-stopped \
                -v trip-calculate-redis-data:/data \
                redis:7-alpine redis-server --requirepass "${REDIS_PASSWORD}"
              
              echo "✅ Redis container created"
            fi

            # Existing Redis containers may come from a different migration network.
            # Attach Redis when needed and fail closed on genuine Docker errors.
            if [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "trip-calculate-network"}}connected{{end}}' trip-calculate-redis)" = "connected" ]; then
              echo "✅ Redis already on deployment network"
            else
              if ! docker network connect trip-calculate-network trip-calculate-redis; then
                echo "❌ Failed to connect Redis to deployment network"
                exit 1
              fi
              echo "✅ Redis connected to deployment network"
            fi

            # Wait for Redis to be ready
            echo "⏳ Waiting for Redis to be ready..."
            sleep 3

            # Verify Redis health
            echo "🔍 Verifying Redis connectivity..."
            if docker exec trip-calculate-redis redis-cli -a "${REDIS_PASSWORD}" ping 2>/dev/null | grep -q "PONG"; then
              echo "✅ Redis health check passed"
            else
              echo "❌ Redis health check failed"
              echo "📋 Redis logs:"
              docker logs trip-calculate-redis --tail 20
              exit 1
            fi

            # Check Redis port exposure (security)
            if docker port trip-calculate-redis 2>/dev/null | grep -q "6379"; then
              echo "⚠️ WARNING: Redis port 6379 is EXPOSED to internet!"
              echo "🔒 Security Risk: Redis should NOT expose port 6379"
              exit 1
            else
              echo "✅ Redis security verified - port 6379 NOT exposed"
            fi

            # ==================== AGENT DEPLOYMENT ====================
            echo ""
            echo "🤖 Deploying agent service..."

            docker pull "${DOCKER_USERNAME}/trip-calculate-agent:prod-${GITHUB_SHA}"

            if docker ps -a --format '{{.Names}}' | grep -q '^trip-calculate-agent$'; then
              docker stop trip-calculate-agent
              docker rm trip-calculate-agent
            fi

            docker run -d \
              --name trip-calculate-agent \
              --restart unless-stopped \
              --network trip-calculate-network \
              -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e DATABASE_USERNAME="${DATABASE_USERNAME}" \
              -e DATABASE_PASSWORD="${DATABASE_PASSWORD}" \
              -e LANGFUSE_PUBLIC_KEY="${LANGFUSE_PUBLIC_KEY}" \
              -e LANGFUSE_SECRET_KEY="${LANGFUSE_SECRET_KEY}" \
              -e LANGFUSE_HOST="${LANGFUSE_HOST}" \
              -e LANGFUSE_TRACING_ENVIRONMENT="production" \
              -e LANGFUSE_RELEASE="${GITHUB_SHA}" \
              "${DOCKER_USERNAME}/trip-calculate-agent:prod-${GITHUB_SHA}"

            echo "✅ Agent container started"

            echo "⏳ Waiting for agent health..."
            for i in $(seq 1 10); do
              sleep 3
              if docker exec trip-calculate-agent python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" >/dev/null 2>&1; then
                echo "✅ Agent health check passed"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "❌ Agent health check failed"
                docker logs trip-calculate-agent --tail 30
                exit 1
              fi
            done

            # ==================== APPLICATION DEPLOYMENT ====================
            echo ""
            echo "📦 Deploying application..."
            
            # Pull the immutable image produced for this exact release.
            docker pull "${DOCKER_USERNAME}/trip-calculate:prod-${GITHUB_SHA}"

            # Stop and remove the old container only when it exists. Failures
            # are fatal so a stale exact-SHA container cannot mask this run.
            if docker ps -a --format '{{.Names}}' | grep -q '^trip-calculate-prod$'; then
              docker stop trip-calculate-prod
              docker rm trip-calculate-prod
            fi

            # Run new container with Redis connection
            docker run -d -p 8080:8080 \
              --name trip-calculate-prod \
              --restart unless-stopped \
              --network trip-calculate-network \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e DATABASE_USERNAME="${DATABASE_USERNAME}" \
              -e DATABASE_PASSWORD="${DATABASE_PASSWORD}" \
              -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
              -e GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
              -e OAUTH_REDIRECT_URI="${OAUTH_REDIRECT_URI}" \
              -e GMAIL_USERNAME="${GMAIL_USERNAME}" \
              -e GMAIL_APP_PASSWORD="${GMAIL_APP_PASSWORD}" \
              -e ADMIN_EMAIL="${ADMIN_EMAIL}" \
              -e MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN}" \
              -e REDIS_HOST=trip-calculate-redis \
              -e REDIS_PORT=6379 \
              -e REDIS_PASSWORD="${REDIS_PASSWORD}" \
              -e AI_CACHE_TTL_HOURS=24 \
              -e AGENT_URL="${AGENT_URL}" \
              "${DOCKER_USERNAME}/trip-calculate:prod-${GITHUB_SHA}"

            echo "✅ Application container started"
            docker ps -a | grep trip-calculate

            # ==================== CONNECTIVITY VERIFICATION ====================
            echo ""
            echo "🔍 Verifying inter-container connectivity..."
            sleep 5
            
            # Check database connectivity
            if docker exec trip-calculate-prod ping -c 2 trip-calculate-db >/dev/null 2>&1; then
              echo "✅ Database connectivity verified"
            else
              echo "❌ Cannot reach database from application"
              exit 1
            fi

            # Check Redis connectivity
            if docker exec trip-calculate-prod ping -c 2 trip-calculate-redis >/dev/null 2>&1; then
              echo "✅ Redis connectivity verified"
            else
              echo "❌ Cannot reach Redis from application"
              exit 1
            fi

            # ==================== HEALTH CHECK ====================
            echo ""
            echo "⏳ Waiting for application to start..."
            echo "📊 Monitoring startup progress..."

            RETRY_COUNT=0
            MAX_RETRIES=15  # Increased for Redis initialization
            RETRY_INTERVAL=5

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep $RETRY_INTERVAL
              RETRY_COUNT=$((RETRY_COUNT + 1))

              echo "⏳ Attempt $RETRY_COUNT/$MAX_RETRIES - checking health endpoint..."

              if curl -f http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "✅ Application health check passed on attempt $RETRY_COUNT"
                curl -s http://localhost:8080/actuator/health | grep -o '"status":"[^"]*"'
                break
              fi

              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Health check failed after $MAX_RETRIES attempts!"
                echo ""
                echo "📋 Application logs:"
                docker logs trip-calculate-prod --tail 50
                echo ""
                echo "🔴 Redis logs:"
                docker logs trip-calculate-redis --tail 20
                echo ""
                exit 1
              fi
            done

            # Check for connection errors in logs
            echo ""
            echo "🔍 Checking for connection issues..."

            if ! APP_LOG_TAIL="$(docker logs trip-calculate-prod --tail 50 2>&1)"; then
              echo "❌ Could not inspect application logs"
              exit 1
            fi

            if CONNECTION_ISSUES="$(printf '%s\n' "${APP_LOG_TAIL}" | grep -Ei "connection.*refused|unable to.*database|authentication.*failed")"; then
              echo "⚠️ Warning: Potential database connection issues"
              printf '%s\n' "${CONNECTION_ISSUES}"
            fi

            if REDIS_ISSUES="$(printf '%s\n' "${APP_LOG_TAIL}" | grep -Ei "redis.*connection.*refused|unable to.*redis")"; then
              echo "⚠️ Warning: Potential Redis connection issues"
              printf '%s\n' "${REDIS_ISSUES}"
            fi

            # ==================== FINAL VERIFICATION ====================
            # Gather fresh evidence after every connectivity and startup check.
            # Any mismatch exits before the celebratory summary is printed.
            APP_IMAGE="$(docker inspect -f '{{.Config.Image}}' trip-calculate-prod)"
            AGENT_IMAGE="$(docker inspect -f '{{.Config.Image}}' trip-calculate-agent)"
            APP_IMAGE_ID="$(docker inspect -f '{{.Image}}' trip-calculate-prod)"
            AGENT_IMAGE_ID="$(docker inspect -f '{{.Image}}' trip-calculate-agent)"
            ARCHITECTURE="$(docker image inspect -f '{{.Architecture}}' "${APP_IMAGE}")"
            APP_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trip-calculate-prod)"
            AGENT_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trip-calculate-agent)"
            if ! APP_RESTARTS="$(docker inspect -f '{{.RestartCount}}' trip-calculate-prod)"; then
              echo "❌ Could not inspect application restart count"
              exit 1
            fi
            if ! AGENT_RESTARTS="$(docker inspect -f '{{.RestartCount}}' trip-calculate-agent)"; then
              echo "❌ Could not inspect agent restart count"
              exit 1
            fi
            DB_NETWORK="$(docker inspect -f '{{with index .NetworkSettings.Networks "trip-calculate-network"}}{{.IPAddress}}{{end}}' trip-calculate-db)"
            REDIS_NETWORK="$(docker inspect -f '{{with index .NetworkSettings.Networks "trip-calculate-network"}}{{.IPAddress}}{{end}}' trip-calculate-redis)"
            if ! DB_PORTS="$(docker port trip-calculate-db 2>/dev/null)"; then
              echo "❌ Could not inspect database port publications"
              exit 1
            fi
            if ! REDIS_PORTS="$(docker port trip-calculate-redis 2>/dev/null)"; then
              echo "❌ Could not inspect Redis port publications"
              exit 1
            fi
            INTERNAL_HEALTH="$(curl -fsS --connect-timeout 5 --max-time 10 http://localhost:8080/actuator/health)"
            PUBLIC_HEALTH_URL="https://trip-calculate.online/actuator/health"
            PUBLIC_HEALTH_CODE="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "${PUBLIC_HEALTH_URL}")"
            if ! ALL_CONTAINERS="$(docker ps -a --format '{{.Names}}')"; then
              echo "❌ Could not inspect rollback container retention"
              exit 1
            fi
            ROLLBACK_CONTAINERS=""
            while IFS= read -r CONTAINER_NAME; do
              case "${CONTAINER_NAME}" in
                trip-calculate-*-rollback-*)
                  if [ -n "${ROLLBACK_CONTAINERS}" ]; then
                    ROLLBACK_CONTAINERS="${ROLLBACK_CONTAINERS},${CONTAINER_NAME}"
                  else
                    ROLLBACK_CONTAINERS="${CONTAINER_NAME}"
                  fi
                  ;;
              esac
            done <<< "${ALL_CONTAINERS}"
            [ -n "${ROLLBACK_CONTAINERS}" ] || ROLLBACK_CONTAINERS="none retained"

            EXPECTED_APP_IMAGE="${DOCKER_USERNAME}/trip-calculate:prod-${GITHUB_SHA}"
            EXPECTED_AGENT_IMAGE="${DOCKER_USERNAME}/trip-calculate-agent:prod-${GITHUB_SHA}"

            if [ "${APP_IMAGE}" != "${EXPECTED_APP_IMAGE}" ] || [ "${AGENT_IMAGE}" != "${EXPECTED_AGENT_IMAGE}" ]; then
              echo "❌ Deployed image tag does not match release ${GITHUB_SHA}"
              exit 1
            fi
            if [ -z "${APP_IMAGE_ID}" ] || [ -z "${AGENT_IMAGE_ID}" ] || [ -z "${ARCHITECTURE}" ]; then
              echo "❌ Could not verify deployed image IDs or architecture"
              exit 1
            fi
            if [ "${APP_HEALTH}" != "healthy" ] || [ "${AGENT_HEALTH}" != "healthy" ]; then
              echo "❌ Containers are not fully healthy (application=${APP_HEALTH}, agent=${AGENT_HEALTH})"
              exit 1
            fi
            if [ -z "${DB_NETWORK}" ] || [ -z "${REDIS_NETWORK}" ]; then
              echo "❌ Database or Redis is missing from trip-calculate-network"
              exit 1
            fi
            if [ -n "${DB_PORTS}" ] || [ -n "${REDIS_PORTS}" ]; then
              echo "❌ Database or Redis has a published host port"
              exit 1
            fi
            if ! docker exec trip-calculate-prod ping -c 1 trip-calculate-db >/dev/null 2>&1; then
              echo "❌ Final application-to-database connectivity check failed"
              exit 1
            fi
            if ! docker exec trip-calculate-prod ping -c 1 trip-calculate-redis >/dev/null 2>&1; then
              echo "❌ Final application-to-Redis connectivity check failed"
              exit 1
            fi
            if ! printf '%s' "${INTERNAL_HEALTH}" | grep -q '"status":"UP"'; then
              echo "❌ Internal actuator health is not UP"
              exit 1
            fi
            if [ "${PUBLIC_HEALTH_CODE}" != "200" ]; then
              echo "❌ Public health endpoint returned HTTP ${PUBLIC_HEALTH_CODE}"
              exit 1
            fi
            if ! FINAL_CONTAINER_STATUS="$(docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep trip-calculate)"; then
              echo "❌ Could not verify final container status"
              exit 1
            fi

            # ==================== DEPLOYMENT SUMMARY ====================
            echo ""
            echo "🎉 Verified Deployment Summary:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Release SHA:             ${GITHUB_SHA}"
            echo "Architecture:            ${ARCHITECTURE}"
            echo "Application image:       ${APP_IMAGE}"
            echo "Application image ID:    ${APP_IMAGE_ID}"
            echo "Agent image:             ${AGENT_IMAGE}"
            echo "Agent image ID:          ${AGENT_IMAGE_ID}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Application health:      ✅ ${APP_HEALTH} (restarts=${APP_RESTARTS}, host port=8080)"
            echo "Agent health:            ✅ ${AGENT_HEALTH} (restarts=${AGENT_RESTARTS}, internal port=8001)"
            echo "Database network:        ✅ trip-calculate-network (${DB_NETWORK})"
            echo "Redis network:           ✅ trip-calculate-network (${REDIS_NETWORK})"
            echo "Database host port:      ✅ NOT published"
            echo "Redis host port:         ✅ NOT published"
            echo "Database connectivity:   ✅ verified from application"
            echo "Redis connectivity:      ✅ verified from application"
            echo "Internal health:         ✅ UP"
            echo "Public health:           ✅ HTTP ${PUBLIC_HEALTH_CODE} (${PUBLIC_HEALTH_URL})"
            echo "Rollback containers:     ${ROLLBACK_CONTAINERS}"
            echo ""
            echo "📦 Final container status:"
            printf '%s\n' "${FINAL_CONTAINER_STATUS}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deployment status: VERIFIED COMPLETE"
          REMOTE

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/vps_deploy_key

      - name: Send Deployment Notification
        if: success()
        run: |
          echo "✅ Production release ${{ github.sha }} was verified and deployed"

      - name: Send Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Production release pipeline failed for ${{ github.sha }}; deployment verification may not have completed"