name: Live Route Intelligence Evaluation

# Manual only. A real-model evaluation costs money and makes the run depend on
# an external provider, so it must never sit on the ordinary PR path. Use it
# before a release, after a prompt change, or when switching model.
#
# A full run is ~45 cases against gpt-4o-mini and costs roughly $0.01.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Substring filter on dataset filename (blank = all)"
        required: false
        default: ""
      fail_under:
        description: "Fail the run if the case pass rate drops below this (0-1)"
        required: false
        default: "0.9"

permissions:
  contents: read

jobs:
  evaluate:
    name: Live evaluation (real model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install agent dev dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Secrets reach the process only as env vars — never echoed, never
      # passed on a command line where they would land in the run log.
      # Dispatch inputs go through env too rather than being interpolated into
      # the script body, so an input can never be parsed as shell.
      - name: Run live evaluation
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          DATASET: ${{ inputs.dataset }}
          FAIL_UNDER: ${{ inputs.fail_under }}
        run: |
          args=(--mode live --fail-under "$FAIL_UNDER")
          if [ -n "$DATASET" ]; then
            args+=(--dataset "$DATASET")
          fi
          python -m evals.runner "${args[@]}"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-report
          path: agent/evals/results/
          if-no-files-found: warn
