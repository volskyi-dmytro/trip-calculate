name: Build Feature Branches

on:
  push:
    branches: 
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches: [ develop, master ]

# Default GITHUB_TOKEN is read-only; the PR-comment step needs write access
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The Python agent owns the LLM-facing contract, so it gets its own blocking
  # gate: unit tests plus the mock-mode evaluation suite. Mock mode needs no
  # OPENAI_API_KEY and makes no network calls, so it is safe to run on every PR.
  # A real-model evaluation is deliberately NOT here — see eval-live.yml.
  agent-tests:
    name: Python agent tests + evaluation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install agent dev dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run agent unit tests
        working-directory: agent
        run: pytest -q -m "not integration and not db"

      - name: Run evaluation suite (mock/contract mode)
        working-directory: agent
        run: python -m evals.runner --mode mock

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-mock-report
          path: agent/evals/results/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for React frontend build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build React frontend
      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run audit:ci
          npm run build

      # Copy React build to Spring Boot static resources
      - name: Copy Frontend to Spring Boot
        run: |
          rm -rf src/main/resources/static/*
          mkdir -p src/main/resources/static
          cp -r frontend/dist/* src/main/resources/static/

      # Setup Java and build Spring Boot
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build and test
      - name: Build and Test
        run: |
          echo "🔨 Building feature branch..."
          mvn clean package -DskipTests
          
          echo "✅ Build successful!"
          echo "📦 JAR file:"
          ls -lh target/*.jar
          
      # Optional: Run tests
      - name: Run Tests
        run: mvn test
        continue-on-error: true  # Don't fail the build if tests fail

      # Optional: Build Docker image but don't push
      - uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image (No Push)
        run: |
          echo "🐳 Building Docker image for validation..."
          docker build -t trip-calculate:feature-${{ github.sha }} .
          echo "✅ Docker build successful!"

      # Add PR comment with build status (cosmetic — never fail the build over it)
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! Ready for review.'
            })